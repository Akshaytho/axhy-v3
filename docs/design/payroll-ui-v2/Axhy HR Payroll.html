<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Axhy v3 — HR Payroll</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { height: 100%; background: #2a2520; }
  .stage {
    min-height: 100vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 28px; box-sizing: border-box;
    background:
      radial-gradient(circle at 20% 0%, rgba(192,73,42,0.10), transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(40,30,20,0.4), transparent 50%),
      #2a2520;
  }
  .hr-root { display: flex; height: 100%; background: var(--paper); }
  .toast {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--card);
    padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    font-family: var(--font-sans); box-shadow: var(--sh-3);
    display: flex; align-items: center; gap: 9px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .stub {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--ink-3); font-family: var(--font-sans);
  }
</style>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#f6f1e8"/>
    <rect x="22" y="30" width="56" height="40" rx="4" fill="#fdfaf3" stroke="#c0492a" stroke-width="2"/>
    <rect x="30" y="40" width="40" height="4" rx="2" fill="#c0492a"/>
    <rect x="30" y="50" width="28" height="3" rx="1.5" fill="#7a6b58"/>
    <rect x="30" y="58" width="34" height="3" rx="1.5" fill="#7a6b58"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hr-core.jsx"></script>
<script type="text/babel" src="hr-dashboard.jsx"></script>
<script type="text/babel" src="hr-review.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#c0492a"
}/*EDITMODE-END*/;

function Stub({ label }) {
  return (
    <div className="stub">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--ink-4)" strokeWidth="1.4"
        strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
      <div style={{fontSize:15, fontWeight:600, color:'var(--ink-2)'}}>{label}</div>
      <div style={{fontSize:13}}>Out of scope for this exploration — payroll is the focus.</div>
    </div>
  );
}

function HRApp() {
  const [nav, setNav] = useState('payroll');
  const [view, setView] = useState('dashboard'); // dashboard | run
  const [workers, setWorkers] = useState(window.SEED_WORKERS);
  const [run, setRun] = useState({ status: 'DRAFT', method: null, ref: null, paidOn: null });
  const [toast, setToast] = useState(null);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(window.__t);
    window.__t = setTimeout(() => setToast(null), 2400);
  };

  // current run summary for the dashboard tiles
  const cfg = window.CONFIG_SNAPSHOT;
  const slips = workers.map((w) => window.computePayslip(w, cfg));
  const summary = {
    status: run.status, workers: workers.length,
    net: slips.reduce((s, x) => s + x.net, 0),
    deduct: slips.reduce((s, x) => s + x.totalDeduct, 0),
    method: run.method, ref: run.ref, paidOn: run.paidOn,
  };

  let body;
  if (nav !== 'payroll') {
    const labels = { overview: 'Overview', workers: 'Workers', sites: 'Sites', settings: 'Settings' };
    body = <Stub label={labels[nav]} />;
  } else if (view === 'dashboard') {
    body = <window.PayrollDashboard currentRun={summary}
      onOpen={(id) => { if (id === 'may') setView('run'); else showToast('Past run — view-only in this prototype'); }} />;
  } else {
    body = <window.RunReview run={run} setRun={setRun} workers={workers} setWorkers={setWorkers}
      onBack={() => setView('dashboard')} onToast={showToast} />;
  }

  return (
    <div className="hr-root">
      <window.Sidebar nav={nav} setNav={(n) => { setNav(n); }} />
      {body}
      <div className={'toast' + (toast ? ' show' : '')}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg>
        {toast}
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = window.useTweaks ? window.useTweaks(TWEAKS_DEFAULTS) : [TWEAKS_DEFAULTS, () => {}];
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-2', t.accent);
  }, [t.accent]);

  return (
    <>
      <div className="stage">
        <window.ChromeWindow
          width={1320} height={840}
          tabs={[{ title: 'Axhy HR · Payroll' }, { title: 'Attendance' }]}
          activeIndex={0}
          url="console.axhy.app/payroll">
          <HRApp/>
        </window.ChromeWindow>
      </div>

      {window.TweaksPanel && (
        <window.TweaksPanel>
          <window.TweakColor label="Accent" value={t.accent}
            onChange={(v) => setTweak('accent', v)} options={['#c0492a', '#d83a1e']} />
        </window.TweaksPanel>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
