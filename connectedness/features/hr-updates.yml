    - POST /hr-updates # HR admin posts a single update or digest
    - POST /hr-updates/:id/ack # supervisor acks; ackText must be ≥5 words in own voice
    - GET /hr-updates # supervisor inbox (pending / acked sections)

ui:
  surfaces:
    - Updates # secondary surface; NEEDS YOUR ACK / RECENT — ACKNOWLEDGED sections
  prototypes:
