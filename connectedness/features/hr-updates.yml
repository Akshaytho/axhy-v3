feature: hr-updates
status: active-but-contract-incomplete
description: HR Updates digest pattern — parent HRUpdate + child HRUpdateRule entries, push-only at launch.

owns:
  tables:
    - HRUpdate # redesigned in P1 (Phase B.2 placeholder dropped)
    - HRUpdateRule # new in P1; child entries for digests
  state_machines:
    live: []
    planned: [] # HR ack is parallel lifecycle; no DWI state transitions per D.1 §2.5

