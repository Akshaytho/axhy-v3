  - docs/specs/2026-05-12-hr-updates-spec.md # Active but contract-incomplete; launch policy locked
  - docs/specs/2026-05-12-decision-entity-lock.md # D.1 §2.5 + §2.9 schema source
  - docs/specs/2026-05-13-product-framing.md # §13 — ack as primarily operational attention

tests:
  live: []
